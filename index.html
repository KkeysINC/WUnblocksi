<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnBlocksi Games Launcher</title>
    <style>
        :root {
            /* Space Command Bridge Palette */
            --bg-color: #030914;
            --card-bg: rgba(6, 20, 40, 0.75);
            --accent-color: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --text-color: #ffffff;
            --text-secondary: #8ab4f8;
            --border-glow: #00f0ff;
            --panel-trim: #102a45;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            
            /* Animated Starfield Background */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: warpStars 90s linear infinite;
        }

        /* Star movement effect */
        @keyframes warpStars {
            from { background-position: 0 0, 40px 60px, 130px 270px; }
            to { background-position: 550px 1100px, 350px 700px, 250px 500px; }
        }

        /* Spaceship Bridge Top Navigation Panel */
        nav {
            background: linear-gradient(180deg, #040d1a 0%, var(--card-bg) 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* Futuristic hull wing accent line */
        nav::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 5%;
            width: 90%;
            height: 6px;
            background: var(--accent-color);
            clip-path: polygon(0 0, 1% 100%, 99% 100%, 100% 0);
            opacity: 0.6;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--border-glow), 0 0 20px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo::before {
            content: '▲';
            color: var(--accent-color);
            font-size: 14px;
            animation: systemBlink 2s infinite ease-in-out;
        }

        @keyframes systemBlink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Sci-Fi Tactical Search Box Container */
        .search-container {
            position: relative;
            width: 280px;
        }

        .search-input {
            width: 100%;
            background: rgba(3, 9, 20, 0.6);
            border: 1px solid var(--panel-trim);
            border-radius: 4px;
            padding: 10px 15px;
            color: #ffffff;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-sizing: border-box;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 35%, 100% 100%, 0 100%);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            background: rgba(6, 20, 40, 0.8);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        /* Main Bridge Deck Container */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Sci-Fi Target Header */
        .section-title {
            font-size: 28px;
            margin-bottom: 30px;
            border-left: 5px solid var(--accent-color);
            padding-left: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
            position: relative;
        }

        .section-title::after {
            content: ' // SYSTEM_READY';
            font-size: 12px;
            color: var(--accent-color);
            letter-spacing: 1px;
            font-weight: normal;
            vertical-align: middle;
            margin-left: 10px;
        }

        /* Grid Configuration */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Spaceship Display Console Card */
        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--panel-trim);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Tech corner overlay */
        .game-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 16px; height: 16px;
            background: linear-gradient(225deg, var(--accent-color) 45%, transparent 55%);
            transition: all 0.3s ease;
            z-index: 2;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.25);
        }

        .game-card:hover::before {
            width: 24px;
            height: 24px;
            background: linear-gradient(225deg, #ffffff 45%, transparent 55%);
        }

        .game-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 2px solid var(--panel-trim);
            transition: filter 0.3s ease;
        }

        .game-card:hover .game-thumb {
            filter: brightness(1.1) contrast(1.05);
        }

        .game-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(6,20,40,0) 0%, rgba(3,9,20,0.8) 100%);
        }

        .game-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .game-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 0 20px 0;
            line-height: 1.5;
            flex-grow: 1;
        }

        /* Tactical Activation Launcher Button */
        .launch-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, rgba(0,210,255,0.05) 0%, rgba(0,210,255,0.15) 100%);
            color: var(--accent-color);
            text-decoration: none;
            padding: 12px;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--accent-color);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);
            transition: all 0.3s ease;
        }

        .launch-btn:hover {
            background: linear-gradient(135deg, var(--accent-color) 0%, #0088ff 100%);
            color: #030914;
            box-shadow: 0 0 15px var(--border-glow);
            padding-left: 22px;
        }
    </style>
</head>
<body>

    <!-- Space Flight Deck Navigation Panel -->
    <nav>
        <div class="logo">UnBlocksi Dashboard</div>
        <div class="search-container">
            <input type="text" id="gameSearch" class="search-input" placeholder="Search targets..." onkeyup="filterGames()">
        </div>
    </nav>

    <!-- Main Mission Grid Panel -->
    <div class="container">
        <h2 class="section-title">Available Operations</h2>
        
        <div class="grid-container" id="gamesGrid">
            <!-- Game Card Module 01 -->
            <div class="game-card">
                <img src="https://unsplash.com" alt="Game Matrix" class="game-thumb">
                <div class="game-info">
                    <h3 class="game-title">Cyber Strike</h3>
                    <p class="game-desc">Deploy into hostile territory within this fast-paced neon tactical simulation environment.</p>
                    <a href="games/cyberstrike/index.html" class="launch-btn">Initialize Core</a>
                </div>
            </div>

            <!-- Game Card Module 02 -->
            <div class="game-card">
                <img src="https://unsplash.com" alt="Game Matrix" class="game-thumb">
                <div class="game-info">
                    <h3 class="game-title">Velocity Drift</h3>
                    <p class="game-desc">Push aerodynamic starfighter vectors well past normal atmospheric limits.</p>
                    <a href="games/velocitydrift/index.html" class="launch-btn">Initialize Core</a>
                </div>
            </div>
        </div>
    </div>

    <script>
